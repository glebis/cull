[[permission]]
identifier = "app-file-access"
description = "Allows file-system changing commands for imports, thumbnails, deletes, moves, shares, transforms, and raw previews."
commands.allow = [
  "backfill_raw_previews",
  "cancel_referenced_source_job",
  "copy_image_to_clipboard",
  "create_subfolder",
  "crop_image",
  "delete_folder",
  "delete_images_permanently",
  "import_files",
  "import_folder",
  "move_clipboard_capture_folder",
  "move_image",
  "open_images_with_application",
  "open_referenced_folder",
  "paste_image_from_clipboard",
  "regenerate_single_thumbnail",
  "regenerate_thumbnails",
  "regenerate_thumbnails_by_ids",
  "remember_referenced_folder",
  "remove_referenced_source",
  "rename_folder",
  "rename_image",
  "rescan_sources",
  "rotate_image",
  "set_clipboard_monitor_capture_existing_on_start",
  "set_clipboard_monitor_capture_dir",
  "set_source_recursive_default",
  "share_images",
  "start_clipboard_monitor",
  "stop_clipboard_monitor",
  "trash_images",
  "trash_images_detailed",
]
