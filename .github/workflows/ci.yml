name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Frontend checks
        run: bash scripts/check-ci.sh frontend

  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust checks
        run: bash scripts/check-ci.sh rust

  packaged-interaction-smoke:
    name: Packaged production interaction smoke
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache packaged app build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run packaged production interaction smoke
        env:
          CULL_NATIVE_SMOKE_SHOTS: ${{ runner.temp }}/cull-native-interaction-smoke
        run: bash tests/native/run-packaged-interaction-smoke.sh

      - name: Upload packaged smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-interaction-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/cull-native-interaction-smoke
          if-no-files-found: warn
          retention-days: 14

  site:
    name: Site checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  supply-chain:
    name: Supply-chain audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust audit tools
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Supply-chain audit
        run: bash scripts/supply-chain-audit.sh check
